application:
  name: "pm_mcp_server"
  environment: "development"

dotnet_api:
  base_url: "http://localhost:5273"
  swagger_ui_url: "http://localhost:5273/swagger/index.html"
  openapi_spec_url: null
  timeout_seconds: 30
  max_response_bytes: 1048576
  max_redirects: 3

mcp:
  host: "127.0.0.1"
  port: 8000
  transport: "streamable_http"

search:
  backend: "semantic"
  max_results: 5
  candidate_limit: 20
  minimum_score: null

  embedding:
    provider: "mock"
    base_url: null
    endpoint_path: null
    model: "REPLACE_WITH_CONFIGURED_MULTILINGUAL_MODEL"
    api_key_env_var: "EMBEDDING_API_KEY"
    timeout_seconds: 20
    batch_size: 32
    dimensions: null

  reranking:
    enabled: true
    provider: "mock"
    base_url: null
    endpoint_path: null
    model: null
    api_key_env_var: "RERANKER_API_KEY"
    timeout_seconds: 20
    candidate_limit: 20
    required: true

  llm:
    enabled: false
    provider: null
    base_url: null
    endpoint_path: null
    model: null
    api_key_env_var: "LLM_API_KEY"
    timeout_seconds: 20

  query_enrichment:
    enabled: false

cache:
  enabled: true
  directory: "cache/api_embeddings"

startup_checks:
  validate_catalog: true
  check_embedding_service: true
  check_reranker_service: true
  check_llm_service_when_enabled: true
  fail_on_service_unavailable: true
  allow_catalog_only_startup: false

logging:
  level: "INFO"
  format: "json"
  output: "stdout"

authentication:
  enabled: true
  expiration_claim: "exp"
  clock_skew_seconds: 0
