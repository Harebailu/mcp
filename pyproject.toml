[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "mcp_server"
version = "0.1.0"
description = "Metadata-driven Python MCP server for Project Management API integration"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.1.0",
    "httpx>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0.1",
    "uvicorn>=0.29.0",
    "starlette>=0.37.0",
    "PyJWT>=2.8.0",
]

[project.scripts]
mcp-server = "server.app:main"
pm-mcp-server = "server.app:main"
